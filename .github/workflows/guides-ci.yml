name: AI guide content checks

on:
  pull_request:
    paths:
      - "virtual-event-desk-v0.1/content/**"
      - "virtual-event-desk-v0.1/scripts/**"
      - "virtual-event-desk-v0.1/public/guides/**"
      - ".github/workflows/guides-ci.yml"
  push:
    branches: [main]
    paths:
      - "virtual-event-desk-v0.1/content/**"
      - "virtual-event-desk-v0.1/scripts/**"
      - "virtual-event-desk-v0.1/public/guides/**"

permissions:
  contents: read

jobs:
  article-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtual-event-desk-v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate article drafts
        run: node scripts/guides.mjs validate
      - name: Verify approved output
        run: node scripts/guides.mjs verify
      - name: Verify search visibility files
        run: node scripts/seo.mjs verify
      - name: Run publishing and draft safety tests
        run: node --test scripts/guides.test.mjs scripts/draft-review.test.mjs
